<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Bones of Fate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700&family=Rozha+One&family=Tiro+Devanagari+Hindi&display=swap"
    />
    <style>
      html, body { margin: 0; background: #140806; }
      /* the loading screen: visible before any script runs, faded out by src/game/boot.ts */
      #boot {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(ellipse at 50% 42%, #4a1a12 0%, #24100b 46%, #120705 100%);
        color: #e9d2a6; font-family: 'Mukta', system-ui, sans-serif; text-align: center;
        transition: opacity 0.8s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .boot-title {
        font-family: 'Rozha One', Georgia, serif; font-size: clamp(40px, 8vw, 88px); line-height: 1;
        color: #f0c25a; text-shadow: 0 2px 24px rgba(240, 160, 60, 0.35);
      }
      #boot .boot-sub { font-family: 'Tiro Devanagari Hindi', Georgia, serif; font-size: clamp(16px, 2.4vw, 22px); opacity: 0.85; }
      #boot .boot-bar {
        width: min(320px, 70vw); height: 3px; margin-top: 18px; border-radius: 2px;
        background: rgba(240, 194, 90, 0.18); overflow: hidden; position: relative;
      }
      #boot .boot-bar i {
        position: absolute; left: 0; top: 0; bottom: 0; width: 30%;
        background: #f0c25a; border-radius: 2px; transition: width 0.4s ease;
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      /* until the game reports real progress, the bar sweeps */
      #boot .boot-bar.known i { animation: none; }
      @keyframes boot-slide { 0% { left: -30%; } 100% { left: 100%; } }
      #boot .boot-note { font-size: 14px; letter-spacing: 0.06em; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-title">Bones of Fate</div>
      <div class="boot-sub">चौसर · a game of dice against Shakuni</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-note">Preparing the court…</div>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
